{{- if .Values.onePassword.enabled -}}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "ssoerator.secretName" . }}
  labels:
    {{- include "ssoerator.labels" . | nindent 4 }}
spec:
  itemPath: {{ required "onePassword.itemPath is required when onePassword.enabled=true" .Values.onePassword.itemPath | quote }}
{{- end }}
