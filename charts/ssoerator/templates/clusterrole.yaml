apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ssoerator.fullname" . }}
  labels:
    {{- include "ssoerator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
      - apps
    resources:
      - secrets
      - configmaps
      - deployments
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
  - apiGroups:
      - fintlabs.no
      - traefik.containo.us
      - traefik.io
    resources:
      - "*"
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
