{{- if .Values.serviceAccount.create -}}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "ssoerator.fullname" . }}
  labels:
    {{- include "ssoerator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ssoerator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ssoerator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
